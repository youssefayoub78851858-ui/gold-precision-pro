<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Gold Precision Pro Ultimate — Offline Research</title>
<style>body{font:18px system-ui;background:#101820;color:#eee;max-width:1000px;margin:3em auto;padding:1em}button,input{font:inherit;padding:12px}pre{direction:ltr;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere;background:#192630;padding:20px}h1{color:#e4bd69}</style>
<h1>Gold Precision Pro Ultimate</h1><p>مختبر بيانات محاكاة أو مسجلة فقط. لا اتصال بمزودي الأسعار ولا تنفيذ أوامر. النتائج ليست إثباتاً لربحية الاستراتيجية.</p>
<label>ملف أدلة JSON <input id="file" type="file" accept=".json,application/json"></label><button id="run">تحليل الملف</button><p id="status" role="status">اختر ملفاً؛ لا جلب تلقائي.</p><pre id="result"></pre>
<script>
const button=document.getElementById('run');button.onclick=async()=>{
 button.disabled=true;document.getElementById('result').textContent='';
 try{const f=document.getElementById('file').files[0];if(!f)throw Error('اختر ملف JSON');if(f.size>1048576)throw Error('الحد الأقصى 1 MiB');
 const response=await fetch('/api/v3/ultimate',{method:'POST',headers:{'Content-Type':'application/json'},body:await f.text(),signal:AbortSignal.timeout(10000)});
 const data=await response.json();if(!response.ok)throw Error(data.error);if(data.executable!==false||data.signal!=='WAIT')throw Error('استجابة غير آمنة');
 document.getElementById('status').textContent='WAIT | '+data.reason+' | مصادر جاهزة: '+data.monitoring.readyFeeds+'/'+data.monitoring.totalFeeds;
 document.getElementById('result').textContent=JSON.stringify(data,null,2);
 }catch(e){document.getElementById('status').textContent=e.message;}finally{button.disabled=false;}
};
</script></html>
