name: Massive pre-purchase no-billing XAUUSD handoff (offline)
on:
  push:
    branches: [review/v2-portable-tests-20261109]
    paths:
      - 'coordinator/massive_ws_synthetic_bridge.js'
      - 'coordinator/test_massive_ws_synthetic_bridge.js'
      - 'coordinator/fx_dollar_basket_proxy.js'
      - 'coordinator/test_fx_dollar_basket_proxy.js'
      - 'coordinator/massive_readonly_probe.js'
      - 'coordinator/test_massive_readonly_probe.js'
      - 'coordinator/massive_reconnect_controller.js'
      - 'coordinator/test_massive_reconnect_controller.js'
      - 'coordinator/offline_m15_cycle.py'
      - 'coordinator/test_offline_m15_cycle.py'
      - 'coordinator/test_offline_m15_paper_cycle.py'
      - 'coordinator/test_offline_m15_restart.py'
      - 'coordinator/offline_m15_supervisor.py'
      - 'coordinator/test_offline_m15_supervisor.py'
      - 'coordinator/research_monitor*.py'
      - 'coordinator/research_notification.py'
      - 'coordinator/ultimate_paper.py'
      - 'coordinator/ultimate_forward_plan.py'
      - 'research/ultimate-prospective-plan.json'
      - 'coordinator/massive_ws_handshake.js'
      - 'coordinator/test_massive_ws_handshake.js'
      - 'coordinator/massive_pre_purchase_handoff.py'
      - 'coordinator/test_massive_pre_purchase_handoff.py'
      - 'coordinator/massive_bbo_history_adapter.py'
      - 'coordinator/massive_synthetic_cutover.py'
      - 'coordinator/test_massive_synthetic_cutover.py'
      - 'coordinator/massive_readonly_history_probe.py'
      - 'coordinator/test_massive_readonly_history_probe.py'
      - 'coordinator/xauusd_feed_gate.py'
      - 'coordinator/xauusd_research_pipeline.py'
      - '.github/workflows/massive-prepurchase-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-billing-massive-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Real research intake must refuse synthetic and unlicensed Massive quotes
        working-directory: coordinator
        run: python -m unittest -v test_massive_pre_purchase_handoff test_massive_bbo_history_adapter
      - name: Historical-vs-streaming mock BID/ASK M15 H1 H4 has no market-availability claims
        working-directory: coordinator
        run: python -m unittest -v test_massive_history_stream_parity
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Mock transport handshake and failure handling (no socket)
        run: node coordinator/test_massive_ws_handshake.js
      - name: Offline transport to candle to research gate integration
        run: node coordinator/test_massive_ws_synthetic_bridge.js
      - name: Offline six-currency dollar proxy (not official DXY)
        run: node coordinator/test_fx_dollar_basket_proxy.js
      - name: Bounded read-only connection probe with injected fake socket
        run: node coordinator/test_massive_readonly_probe.js
      - name: Bounded reconnect policy with mocked attempts only
        run: node coordinator/test_massive_reconnect_controller.js
      - name: Offline M15 event cycle through real research engines
        working-directory: coordinator
        run: python -m unittest -v test_offline_m15_cycle test_offline_m15_paper_cycle test_offline_m15_restart test_offline_m15_supervisor
      - name: Verify original prospective strategy freeze without changing manifest
        run: python coordinator/ultimate_forward_plan.py research/ultimate-prospective-plan.json
      - name: Bounded historical GET sample with injected fake transport
        working-directory: coordinator
        run: python -m unittest -v test_massive_readonly_history_probe
      - name: Rehearse historical-to-stream overlapping closed candles without real merging
        working-directory: coordinator
        run: python -m unittest -v test_massive_synthetic_cutover
