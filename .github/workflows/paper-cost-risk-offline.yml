name: Paper risk budget vs costs (offline only)
on:
  push:
    branches: [review/v2-portable-tests-20261109]
    paths:
      - 'coordinator/paper_cost_preflight.py'
      - 'coordinator/test_paper_cost_preflight.py'
      - '.github/workflows/paper-cost-risk-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paper-cost-no-trading:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify synthetic roundtrip cost risk and fail closed without provider
        run: python -m unittest discover -s coordinator -p test_paper_cost_preflight.py -v
