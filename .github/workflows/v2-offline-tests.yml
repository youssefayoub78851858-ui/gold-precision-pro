name: V2 offline unit tests
on:
  push:
    branches:
      - review/v2-portable-tests-20261109
  workflow_dispatch:
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify package integrity and report every mismatch
        working-directory: coordinator/app
        run: |
          python - <<'PY'
          import json,hashlib,pathlib,sys
          root=pathlib.Path('.')
          manifest=json.loads((root/'package-manifest.json').read_text())
          mismatches=[]
          for name,expected in manifest['files'].items():
              file=root/name
              actual=hashlib.sha256(file.read_bytes()).hexdigest() if file.exists() else 'MISSING'
              if actual!=expected:
                  mismatches.append((name,expected,actual))
          for name,expected,actual in mismatches:
              print(f'MISMATCH {name}: expected={expected} actual={actual}')
          print(f'INTEGRITY: {len(manifest["files"])-len(mismatches)} matched; {len(mismatches)} mismatched')
          if mismatches: sys.exit(1)
          PY
      - name: Offline Python tests
        working-directory: coordinator/app
        run: python -m unittest -v test_worker test_reduced
      - name: V2 API isolated smoke test (no provider)
        working-directory: coordinator
        env:
          BROKER_TOKEN: offline-test-token-0123456789-strong
          MARKET_DATA_BROKER_URL: http://127.0.0.1:9
          PORT: '3129'
        run: |
          node service/server.js > /tmp/v2-api.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3129/health > /tmp/v2-health.json; then break; fi
            sleep 0.2
          done
          python - <<'PY'
          import json,urllib.request,urllib.error
          data=json.load(open('/tmp/v2-health.json'))
          assert data['signalEngine']=='Gold Precision Pro V2',data
          assert data['trading']=='disabled',data
          try:
              urllib.request.urlopen('http://127.0.0.1:3129/api/candles?interval=invalid')
              raise AssertionError('Invalid interval unexpectedly accepted')
          except urllib.error.HTTPError as error:
              assert error.code==400,error.code
          print('PASS: V2 API health, trading disabled, invalid interval rejected; no provider used')
          PY
      - name: Offline V2 API integration failure-safety
        working-directory: coordinator
        run: python -m unittest -v test_api_integration
      - name: Paper worker one-shot recorded synthetic smoke
        working-directory: coordinator
        env:
          PAPER_DATA_MODE: recorded_replay
        run: |
          python - <<'PY'
          import json,pathlib
          fixture={f:{'symbol':'XAU/USD','interval':f,'values':[]} for f in ['15min','1h','4h']}
          pathlib.Path('/tmp/gold-v2-synthetic-closed.json').write_text(json.dumps(fixture))
          PY
          DATA_DIR="$RUNNER_TEMP/v2-paper-smoke" python app/worker.py --fixture /tmp/gold-v2-synthetic-closed.json
          DATA_DIR="$RUNNER_TEMP/v2-paper-smoke" python app/worker.py --backup
          DATA_DIR="$RUNNER_TEMP/v2-paper-smoke" python - <<'PY'
          import json,os,pathlib,sqlite3
          directory=pathlib.Path(os.environ['DATA_DIR'])
          with sqlite3.connect(directory/'monitor.sqlite3') as db:
              observations=db.execute('SELECT COUNT(*) FROM observations WHERE status="PROCESSED"').fetchone()[0]
              events=[json.loads(x[0]) for x in db.execute('SELECT json FROM events')]
              mode=db.execute("SELECT value FROM metadata WHERE key='paperDataMode'").fetchone()[0]
          assert observations==1,(observations,events)
          assert mode=='recorded_replay',mode
          assert events and all(e.get('type')!='PAPER_ENTRY' for e in events),events
          assert (directory/'latest-backup.sqlite3').exists()
          print('PASS: one-shot paper observation persisted, backup created, no paper entry, recorded mode')
          PY
      - name: Recorded closed-bar paper replay and restart
        working-directory: coordinator
        env:
          PAPER_DATA_MODE: recorded_replay
        run: python -m unittest -v test_recorded_closed_bars
      - name: Paper entry exit transactional lifecycle
        working-directory: coordinator
        env:
          PAPER_DATA_MODE: recorded_replay
        run: python -m unittest -v test_paper_event_lifecycle
      - name: Synthetic backtest accounting regression
        working-directory: coordinator
        run: node test_backtest_accounting.js
      - name: Historical signal replay future-data leakage
        working-directory: coordinator
        run: node test_historical_no_lookahead.js
      - name: Validate historical data provenance and OHLC
        working-directory: coordinator
        run: python -m unittest -v test_validate_history
      - name: Historical backtest runner safety gates
        working-directory: coordinator
        run: node test_historical_runner.js

      - name: V3 market structure research unit tests
        working-directory: coordinator
        run: node test_v3_market_structure.js

      - name: V3 multi-timeframe closed-bar unit tests
        working-directory: coordinator
        run: node test_v3_multitimeframe.js

      - name: V3 research-only trade plan tests
        working-directory: coordinator
        run: node test_v3_trade_plan.js

      - name: V3 review API and UI connection acceptance (offline)
        working-directory: coordinator
        run: |
          python -m unittest -v test_v3_connection
          node test_review_ui.js
      - name: Actual coordinator image build and standby restart (no provider)
        run: python coordinator/test_container_standby.py
