name: V2 offline unit tests
on:
  push:
    branches:
      - review/v2-portable-tests-20261109
  workflow_dispatch:
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify package integrity and report every mismatch
        working-directory: coordinator/app
        run: |
          python - <<'PY'
          import json,hashlib,pathlib,sys
          root=pathlib.Path('.')
          manifest=json.loads((root/'package-manifest.json').read_text())
          mismatches=[]
          for name,expected in manifest['files'].items():
              file=root/name
              actual=hashlib.sha256(file.read_bytes()).hexdigest() if file.exists() else 'MISSING'
              if actual!=expected:
                  mismatches.append((name,expected,actual))
          for name,expected,actual in mismatches:
              print(f'MISMATCH {name}: expected={expected} actual={actual}')
          print(f'INTEGRITY: {len(manifest["files"])-len(mismatches)} matched; {len(mismatches)} mismatched')
          if mismatches: sys.exit(1)
          PY
      - name: Offline Python tests
        working-directory: coordinator/app
        run: python -m unittest -v test_worker test_reduced
      - name: EODHD private read-only readiness and leak protection (offline)
        working-directory: coordinator
        run: python -m unittest -v test_eodhd_private_readiness
      - name: Private EODHD bid-ask to research-only pipeline intake (offline)
        working-directory: coordinator
        run: python -m unittest -v test_eodhd_research_bridge
      - name: EODHD XAUUSD WebSocket safety preflight (offline)
        working-directory: coordinator
        run: node test_eodhd_ws_bridge.js
      - name: Opt-in EODHD worker process gate and isolated lifecycle (offline)
        working-directory: coordinator
        run: python -m unittest -v test_private_eodhd_worker
      - name: Shared broker quota, cache and duplicate request tests (mock provider only)
        working-directory: coordinator
        run: python -m unittest -v test_broker_quota_offline
      - name: Review HTTP compatibility through shared broker (offline)
        working-directory: coordinator
        run: python -m unittest -v test_review_http_contract
      - name: V2 API isolated smoke test (no provider)
        working-directory: coordinator
        env:
          BROKER_TOKEN: offline-test-token-0123456789-strong
          MARKET_DATA_BROKER_URL: http://127.0.0.1:9
          PORT: '3129'
        run: |
          node service/server.js > /tmp/v2-api.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3129/health > /tmp/v2-health.json; then break; fi
            sleep 0.2
          done
          python - <<'PY'
          import json,urllib.request,urllib.error
          data=json.load(open('/tmp/v2-health.json'))
          assert data['signalEngine']=='Gold Precision Pro V2',data
          assert data['trading']=='disabled',data
          try:
              urllib.request.urlopen('http://127.0.0.1:3129/api/candles?interval=invalid')
              raise AssertionError('Invalid interval unexpectedly accepted')
          except urllib.error.HTTPError as error:
              assert error.code==400,error.code
          print('PASS: V2 API health, trading disabled, invalid interval rejected; no provider used')
          PY
      - name: Offline V2 API integration failure-safety
        working-directory: coordinator
        run: python -m unittest -v test_api_integration
      - name: Paper worker one-shot recorded synthetic smoke
        working-directory: coordinator
        env:
          PAPER_DATA_MODE: recorded_replay
        run: |
          python - <<'PY'
          import json,pathlib
          fixture={f:{'symbol':'XAU/USD','interval':f,'values':[]} for f in ['15min','1h','4h']}
          pathlib.Path('/tmp/gold-v2-synthetic-closed.json').write_text(json.dumps(fixture))
          PY
          DATA_DIR="$RUNNER_TEMP/v2-paper-smoke" python app/worker.py --fixture /tmp/gold-v2-synthetic-closed.json
          DATA_DIR="$RUNNER_TEMP/v2-paper-smoke" python app/worker.py --backup
          DATA_DIR="$RUNNER_TEMP/v2-paper-smoke" python - <<'PY'
          import json,os,pathlib,sqlite3
          directory=pathlib.Path(os.environ['DATA_DIR'])
          with sqlite3.connect(directory/'monitor.sqlite3') as db:
              observations=db.execute('SELECT COUNT(*) FROM observations WHERE status="PROCESSED"').fetchone()[0]
              events=[json.loads(x[0]) for x in db.execute('SELECT json FROM events')]
              mode=db.execute("SELECT value FROM metadata WHERE key='paperDataMode'").fetchone()[0]
          assert observations==1,(observations,events)
          assert mode=='recorded_replay',mode
          assert events and all(e.get('type')!='PAPER_ENTRY' for e in events),events
          assert (directory/'latest-backup.sqlite3').exists()
          print('PASS: one-shot paper observation persisted, backup created, no paper entry, recorded mode')
          PY
      - name: Recorded closed-bar paper replay and restart
        working-directory: coordinator
        env:
          PAPER_DATA_MODE: recorded_replay
        run: python -m unittest -v test_recorded_closed_bars
      - name: Paper entry exit transactional lifecycle
        working-directory: coordinator
        env:
          PAPER_DATA_MODE: recorded_replay
        run: python -m unittest -v test_paper_event_lifecycle
      - name: Synthetic backtest accounting regression
        working-directory: coordinator
        run: node test_backtest_accounting.js
      - name: Historical signal replay future-data leakage
        working-directory: coordinator
        run: node test_historical_no_lookahead.js
      - name: Private single-file Dukascopy M15 to complete H1/H4 importer tests (synthetic only)
        working-directory: coordinator
        run: python -m unittest -v test_import_dukascopy_single_m15

      - name: Validate historical data provenance and OHLC
        working-directory: coordinator
        run: python -m unittest -v test_validate_history
      - name: Historical backtest runner safety gates
        working-directory: coordinator
        run: node test_historical_runner.js

      - name: V3 market structure research unit tests
        working-directory: coordinator
        run: node test_v3_market_structure.js

      - name: V3 multi-timeframe closed-bar unit tests
        working-directory: coordinator
        run: node test_v3_multitimeframe.js

      - name: V3 research-only trade plan tests
        working-directory: coordinator
        run: node test_v3_trade_plan.js

      - name: V3 review API and UI connection acceptance (offline)
        working-directory: coordinator
        run: |
          python -m unittest -v test_v3_connection
          node test_review_ui.js
          node test_public_demo.js
      - name: Actual coordinator image build and standby restart (no provider)
        run: python coordinator/test_container_standby.py

      - name: Dukascopy consent audit and metadata-only candle readiness (no network)
        working-directory: coordinator
        run: node test_candle_source_readiness.js

      - name: Read-only MT5 local candle bridge validation (synthetic, no broker/network)
        working-directory: coordinator
        run: python -m unittest -v test_mt5_readonly_export

      - name: MT5 raw clock and DST diagnostic safety tests (fixtures only, no broker/network)
        working-directory: coordinator
        run: python -m unittest -v test_mt5_clock_diagnostic

      - name: CFI Lebanon read-only source remains blocked until official confirmation
        working-directory: coordinator
        run: python -m unittest -v test_cfi_readonly_readiness

      - name: Free independent XAU spot reference validation and candle-blocking tests (mock only)
        working-directory: coordinator
        run: node test_gold_spot_reference.js

      - name: Official free Fed BLS H15 partial-context staging (offline, no market vote)
        working-directory: coordinator
        run: node test_official_context_stage.js
      - name: Official vs market-data source rights and coverage inventory (offline)
        working-directory: coordinator
        run: node test_official_source_inventory.js
      - name: Official US macro RSS and BLS calendar research safety tests (mock feeds)
        working-directory: coordinator
        run: node test_official_macro_review.js

      - name: Official H15 daily RSS refresh safety tests (mock feeds only)
        working-directory: coordinator
        run: node test_h15_official_rss.js

      - name: Ultimate offline evidence, risk and HTTP acceptance
        working-directory: coordinator
        run: |
          node test_v3_ultimate.js
          node test_ultimate_diagnostics.js
          node test_ultimate_news_impact.js
          python -m unittest -v test_ultimate_http test_ultimate_replay test_ultimate_paper test_ultimate_connectors test_ultimate_walkforward test_ultimate_intake

      - name: Recorded BID walk-forward comparison (offline, no provider)
        run: python coordinator/ultimate_walkforward.py research/recorded/2026-09-bid.json research/recorded/2026-10-bid.json --output /tmp/ultimate-walkforward.json

      - name: Recorded data coverage, missing-layer research and holdout freeze (no connections)
        run: |
          python coordinator/ultimate_forward_plan.py research/ultimate-prospective-plan.json
          python coordinator/ultimate_coverage.py research/recorded/2026-09-bid.json research/recorded/2026-10-bid.json --output /tmp/ultimate-data-coverage.json --absence-output /tmp/ultimate-layer-absence.json
      - name: Upload derived data readiness reports only
        uses: actions/upload-artifact@v4
        with:
          name: ultimate-data-readiness
          path: |
            /tmp/ultimate-data-coverage.json
            /tmp/ultimate-layer-absence.json
            /tmp/ultimate-walkforward.json
          retention-days: 14

      - name: Independent Ultimate v2 temporal contracts and preserved v1 registry
        working-directory: coordinator
        run: |
          node test_ultimate_v2.js
          python -m unittest -v test_ultimate_v2
      - name: Reinterpret existing archives under Ultimate v2 (not a fresh holdout)
        run: |
          python coordinator/ultimate_forward_plan.py research/ultimate-v2-prospective-plan.json
          python coordinator/ultimate_v2_compare.py research/recorded/2026-09-bid.json research/recorded/2026-10-bid.json --output /tmp/ultimate-v2-archive-comparison.json
      - name: Upload derived version comparison only
        uses: actions/upload-artifact@v4
        with:
          name: ultimate-v2-archive-comparison
          path: /tmp/ultimate-v2-archive-comparison.json
          retention-days: 14

      - name: Install pinned Databento SDK for local DBN files only
        run: python -m pip install -r coordinator/requirements-databento-dbntest.txt
      - name: Native Databento DBN binary fixtures (official SDK, no vendor connections)
        working-directory: coordinator
        run: python -m unittest -v test_databento_dbn_readonly
      - name: Local Databento GC and official-file import tests (no vendor connections)
        working-directory: coordinator
        run: python -m unittest -v test_databento_local test_official_recorded

      - name: Databento GC MBO and MBP normalized fixture preflight (synthetic only)
        working-directory: coordinator
        run: python -m unittest -v test_databento_gc_book_preflight
      - name: Offline MBO order-book reconstruction state machine (synthetic only)
        working-directory: coordinator
        run: python -m unittest -v test_mbo_order_book

      - name: Private monitor mobile viewer proxy offline safety
        working-directory: coordinator
        run: node test_review_monitor_proxy.js
      - name: Private mobile monitor static security contract
        working-directory: coordinator
        run: python -m unittest -v test_private_mobile_dashboard
      - name: Synthetic broker cost arithmetic and risk block (offline only)
        working-directory: coordinator
        run: python -m unittest -v test_paper_cost_preflight
      - name: Paper trade admission guard and spoofed signal fail-closed (offline)
        working-directory: coordinator
        run: python -m unittest -v test_paper_admission_gate
      - name: Private EODHD recovery debounce, restart, and fail-closed audit (offline)
        working-directory: coordinator
        run: python -m unittest -v test_private_feed_recovery
      - name: Private periodic watchdog audit, restart, and no-network contract
        working-directory: coordinator
        run: python -m unittest -v test_private_review_watchdog
      - name: Offline private EODHD status to SQLite alert and notification journal
        working-directory: coordinator
        run: python -m unittest -v test_eodhd_review_monitor
      - name: Five-stage offline pre-subscription safety inventory
        working-directory: coordinator
        run: |
          python -m unittest -v test_pre_subscription_preflight
          python pre_subscription_preflight.py --output /tmp/pre-subscription-readiness.json
      - name: Upload five-stage offline readiness report
        uses: actions/upload-artifact@v4
        with:
          name: pre-subscription-readiness
          path: /tmp/pre-subscription-readiness.json
          retention-days: 14
      - name: XAUUSD signed intake, UTC candle quality, gaps and outage backoff (offline fixtures)
        working-directory: coordinator
        run: |
          python -m unittest -v test_xauusd_feed_gate
          python -m unittest -v test_xauusd_research_pipeline
          python -m unittest -v test_research_monitor
          python -m unittest -v test_research_monitor_runner
          python -m unittest -v test_research_watchdog
          python -m unittest -v test_massive_xauusd_fixture_adapter
