  fxcm-forexconnect-linux-archive-probe:
    name: FXCM official ForexConnect Linux archive integrity (no execution)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - name: Fetch and index official public Linux archive (no package execution)
        env:
          GITHUB_OUTPUT_DIR: ${{ runner.temp }}/fxcm-forexconnect-linux-archive.json
        run: |
          python3 - <<'PY'
          import hashlib,io,json,os,pathlib,tarfile,urllib.request
          url=('https://raw.githubusercontent.com/fxcm/ForexConnectAPI/master/'
               'ForexConnectAPI-1.6.5-Linux-x86_64.tar.gz')
          out={'source':'OFFICIAL_FXCM_GITHUB','url':url,'status':'BLOCKED_NOT_VERIFIED',
               'downloaded':False,'extracted':False,'sdkExecuted':False,
               'vendorLogins':0,'marketDataRequests':0,'orders':0,'payments':0,
               'cloudPermissionVerified':False,'linuxRuntimeVerified':False}
          try:
              request=urllib.request.Request(url,headers={'User-Agent':'GoldPrecision-ArchiveMetadataCheck/1'})
              with urllib.request.urlopen(request,timeout=25) as response:
                  if response.status!=200:raise RuntimeError('UNEXPECTED_HTTP_'+str(response.status))
                  blob=response.read(16*1024*1024+1)
              if len(blob)>16*1024*1024:raise ValueError('ARCHIVE_OVER_16MB')
              with tarfile.open(fileobj=io.BytesIO(blob),mode='r:gz') as archive:
                  names=[x.name for x in archive.getmembers()]
              unsafe=any(x.startswith('/') or '..' in pathlib.PurePosixPath(x).parts for x in names)
              if unsafe:raise ValueError('UNSAFE_ARCHIVE_MEMBER_NAMES')
              out.update(status='ARCHIVE_FETCHED_INDEXED_NOT_EXECUTED',downloaded=True,
                  sha256=hashlib.sha256(blob).hexdigest(),bytes=len(blob),
                  archiveEntryCount=len(names),sampleEntries=names[:25],
                  sharedLibCount=sum(x.endswith('.so') or '.so.' in x for x in names),
                  jarCount=sum(x.endswith('.jar') for x in names))
          except Exception as ex:
              out.update(errorType=type(ex).__name__,errorSummary=str(ex)[:500])
          p=pathlib.Path(os.environ['GITHUB_OUTPUT_DIR'])
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(out,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({k:v for k,v in out.items() if k!='sampleEntries'}))
          PY
      - name: Upload Linux SDK download and file inventory result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fxcm-forexconnect-linux-archive-probe
          path: ${{ runner.temp }}/fxcm-forexconnect-linux-archive.json
          if-no-files-found: error

  fxcm-forexconnect-bookworm-static-abi:
    name: FXCM SDK static ELF linkage on Debian Bookworm (no provider code execution)
    runs-on: ubuntu-latest
    timeout-minutes: 7
    container:
      image: node:24-bookworm-slim@sha256:01d566e8d94d8c619591d78652babfccd3c6992a3dffa9ed5ab39e11cf6c70e9
    permissions:
      contents: read
    steps:
      - name: Install read-only ELF inspection tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 binutils ca-certificates git
      - uses: actions/checkout@v4
      - name: Inspect official archive without loading any FXCM code
        env:
          ABI_REPORT_PATH: ${{ runner.temp }}/fxcm-bookworm-static-abi.json
        run: |
          python3 coordinator/fxcm_linux_static_abi_probe.py --self-test
          python3 coordinator/fxcm_linux_static_abi_probe.py --output "$ABI_REPORT_PATH"
      - name: Upload static ABI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fxcm-bookworm-static-abi
          path: ${{ runner.temp }}/fxcm-bookworm-static-abi.json
          if-no-files-found: error

