name: One-time no-card Twelve Data XAUUSD trial OHLC check
on:
  push:
    branches: [review/v2-portable-tests-20261109]
    paths: [.github/workflows/check-free-xau-candles.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Test anonymous public trial with safe metadata only
        run: |
          node <<'JS'
          const url = new URL('https://api.twelvedata.com/time_series');
          url.searchParams.set('symbol','XAU/USD');
          url.searchParams.set('interval','15min');
          url.searchParams.set('outputsize','30');
          url.searchParams.set('apikey','demo');
          try{
           const response=await fetch(url,{signal:AbortSignal.timeout(10000),headers:{Accept:'application/json'}});
           const j=await response.json();
           const observations=Array.isArray(j.values)?j.values:[];
           console.log(JSON.stringify({http:response.status,status:j.status||null,errorCode:j.code||null,
             message:typeof j.message==='string'?j.message.slice(0,160):null,
             meta:j.meta?{symbol:j.meta.symbol,interval:j.meta.interval,timezone:j.meta.timezone,exchange:j.meta.exchange}:null,
             rowCount:observations.length,
             newestDateTime:observations[0]?.datetime||null,
             oldestDateTime:observations.at(-1)?.datetime||null,
             hasOhlc:observations.length>0&&['open','high','low','close'].every(k=>k in observations[0])}));
          }catch(e){console.log(JSON.stringify({errorName:e.name,message:String(e.message).slice(0,120)}));}
          JS
