name: BiQuote V3 chronological replay gate (offline only)
on:
  push:
    branches: [review/v2-portable-tests-20261109]
    paths:
      - 'coordinator/biquote_v3_chronological_replay.js'
      - 'coordinator/biquote_signal_data_readiness.js'
      - 'coordinator/test_biquote_signal_data_readiness.js'
      - 'coordinator/test_biquote_v3_chronological_replay.js'
      - 'coordinator/biquote_v3_chronological_private.py'
      - 'coordinator/test_biquote_v3_chronological_private.py'
      - 'coordinator/ultimate_four_stage_review.js'
      - 'coordinator/v3_ultimate.js'
      - '.github/workflows/biquote-v3-chronological-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chronological-v3-offline-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Offline point-in-time XAUUSD frame and first-seen readiness must remain WAIT
        run: node coordinator/test_biquote_signal_data_readiness.js
      - name: Verify no future OHLC, no broker orders, no fictional net PnL
        run: node coordinator/test_biquote_v3_chronological_replay.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: One sealed private archive to count-only V3 audit, never orders
        working-directory: coordinator
        run: python -m unittest -v test_biquote_v3_chronological_private
      - name: Verify frozen V3 four-stage safety still WAIT
        run: node coordinator/test_ultimate_four_stage_review.js
