name: Gold Precision four-stage batch acceptance (offline)
on:
  push:
    branches: [review/v2-portable-tests-20261109]
    paths:
      - 'coordinator/ultimate_batch_acceptance.py'
      - 'coordinator/test_ultimate_batch_acceptance.py'
      - 'coordinator/private_forward_capacity_preflight.py'
      - 'coordinator/test_private_forward_capacity_preflight.py'
      - 'coordinator/biquote_24h_final_verdict.py'
      - 'coordinator/biquote_private_forward_vault.py'
      - 'coordinator/biquote_forward_shadow_review.py'
      - 'coordinator/ultimate_four_stage_review.js'
      - 'coordinator/paper_admission_gate.py'
      - '.github/workflows/gold-four-stage-batch-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  four-stage-frozen-offline-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Four-stage batch integration on verified isolated synthetic test data
        working-directory: coordinator
        run: python -m unittest -v test_ultimate_batch_acceptance test_private_forward_capacity_preflight
      - name: Frozen four-stage V3 research and no real signals
        run: node coordinator/test_ultimate_four_stage_review.js
      - name: Paper account cannot act on synthetic BUY or forged approval
        run: python -m unittest -v coordinator/test_ultimate_four_stage_paper.py
      - name: Underlying vault and final source quality safety tests
        working-directory: coordinator
        run: python -m unittest -v test_biquote_forward_shadow_review test_biquote_24h_final_verdict test_biquote_private_forward_vault
