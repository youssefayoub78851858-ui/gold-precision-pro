      - 'coordinator/biquote_snapshot_capacity_gate.js'
      - 'coordinator/test_biquote_snapshot_capacity_gate.js'
      - 'coordinator/biquote_private_v3_watch.js'
      - 'coordinator/test_biquote_private_v3_watch.js'
      - 'coordinator/test_biquote_watch_wait_explanation_ui.js'
      - 'coordinator/biquote_vendor_h4_session_tail.js'
      - 'coordinator/test_biquote_vendor_h4_session_tail.js'
      - 'coordinator/biquote_mobile_readonly.js'
      - 'coordinator/test_biquote_mobile_readonly.js'
      - 'biquote-mobile-ui.js'
      - 'ultimate.html'
      - 'review-dashboard.html'
      - 'review-dashboard.js'
      - 'coordinator/test_review_dashboard_private_biquote.js'
      - 'index.html'
      - 'server.js'
      - 'coordinator/test_review_dashboard_route.js'
      - 'coordinator/internal_offline_handoff.js'
      - 'coordinator/test_internal_offline_handoff.js'
      - 'coordinator/prelicense_release_audit.js'
      - 'coordinator/test_prelicense_release_audit.js'
      - 'coordinator/test_prelicense_operational_commissioning.py'
      - 'coordinator/xauusd_feed_gate.py'
      - 'coordinator/test_xauusd_feed_gate.py'
      - 'coordinator/xauusd_research_pipeline.py'
      - 'coordinator/test_xauusd_research_pipeline.py'
      - 'coordinator/tests/review_dashboard_safety.test.js'
      - 'coordinator/biquote_v3_chronological_replay.js'
      - 'coordinator/test_biquote_v3_chronological_replay.js'
      - 'coordinator/biquote_v3_chronological_private.py'
      - 'coordinator/test_biquote_v3_chronological_private.py'
      - 'coordinator/test_biquote_signal_data_readiness.js'
      - 'coordinator/independent_context_timing_preflight.js'
      - 'coordinator/test_independent_context_timing_preflight.js'
      - 'coordinator/prospective_paper_holdout_audit.js'
      - 'coordinator/test_prospective_paper_holdout_audit.js'
      - 'coordinator/offline_paper_outcome_journal.py'
      - 'coordinator/test_offline_paper_outcome_journal.py'
      - 'coordinator/offline_paper_periodic_reports.py'
      - 'coordinator/test_offline_paper_periodic_reports.py'
      - 'coordinator/offline_paper_report_readonly.py'
      - 'coordinator/test_offline_paper_report_readonly.py'
      - 'coordinator/review_paper_report_bridge.js'
      - 'coordinator/test_review_paper_report_bridge.js'
      - 'coordinator/paper_persistent_disk_gate.js'
      - 'coordinator/test_paper_persistent_disk_gate.js'
      - 'coordinator/historical_accuracy_evidence_audit.js'
      - 'coordinator/test_historical_accuracy_evidence_audit.js'
      - 'research/recorded/manifest.json'
      - 'research/recorded/2026-09-bid.json'
      - 'research/recorded/2026-10-bid.json'
      - 'research/results/ultimate-walkforward.json'
      - 'research/results/ultimate-v2-archive-comparison.json'
      - 'research/ultimate-prospective-plan.json'
      - 'coordinator/biquote_pre_signal_milestones.js'
      - 'coordinator/test_biquote_pre_signal_milestones.js'
      - 'coordinator/biquote_session_h4_continuity_audit.js'
      - 'coordinator/test_biquote_session_h4_continuity_audit.js'
      - 'coordinator/biquote_capture_h4_horizon_gate.js'
      - 'coordinator/test_biquote_capture_h4_horizon_gate.js'
      - 'coordinator/biquote_h4_evidence_quality_gate.js'
      - 'coordinator/test_biquote_h4_evidence_quality_gate.js'
      - 'coordinator/biquote_render_log_export_readonly.js'
      - 'coordinator/test_biquote_render_log_export_readonly.js'
      - 'private-monitor.html'
      - 'coordinator/test_private_monitor_signal_readiness.js'
      - '.github/workflows/gold-four-stage-batch-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  four-stage-frozen-offline-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Four-stage batch integration on verified isolated synthetic test data
        working-directory: coordinator
        run: python -m unittest -v test_ultimate_batch_acceptance test_private_forward_capacity_preflight test_biquote_declared_pause_forensics test_paper_admission_gate
      - name: Frozen four-stage V3 research and no real signals
        run: node coordinator/test_ultimate_four_stage_review.js
      - name: Unified H4 21-bar chronology and 50-bar paper-history integrity (offline only)
        run: |
          node coordinator/test_biquote_signal_data_readiness.js
          node coordinator/test_biquote_capture_h4_horizon_gate.js
          node coordinator/test_biquote_session_h4_continuity_audit.js
          node coordinator/test_biquote_h4_evidence_quality_gate.js
          node coordinator/test_biquote_pre_signal_milestones.js
          node coordinator/test_biquote_render_log_export_readonly.js
      - name: External DXY GC yields calendar and news point-in-time clocks (offline only)
        run: node coordinator/test_independent_context_timing_preflight.js
      - name: Existing historical BID archive integrity and no fabricated independent accuracy
        run: node coordinator/test_historical_accuracy_evidence_audit.js
      - name: Prospective paper outcome arithmetic, modeled costs, no-trade approval (offline only)
        run: node coordinator/test_prospective_paper_holdout_audit.js
      - name: Daily, weekly, five-close and first-100-close synthetic paper reports (offline only)
        working-directory: coordinator
        run: python -m unittest -v test_offline_paper_periodic_reports
      - name: Read-only existing SQLite paper report and no-real-feed bridge
        run: |
          node coordinator/test_review_paper_report_bridge.js
          node coordinator/test_paper_persistent_disk_gate.js
          cd coordinator
          python -m unittest -v test_offline_paper_report_readonly
      - name: Synthetic paper outcome SQLite journal, replay, tamper and cost-audit integration (offline)
        working-directory: coordinator
        run: python -m unittest -v test_offline_paper_outcome_journal
      - name: Single-snapshot capacity, authenticated VIEWER WATCH and weekend-only H4 diagnostics (all fail-closed)
        run: |
          node coordinator/test_biquote_snapshot_capacity_gate.js
          node coordinator/test_biquote_private_v3_watch.js
          node coordinator/test_biquote_watch_wait_explanation_ui.js
          node coordinator/test_biquote_vendor_h4_session_tail.js
          node coordinator/test_biquote_mobile_readonly.js
          node --check biquote-mobile-ui.js
      - name: Frozen V3 chronological research replay cannot leak tomorrow or place paper orders
        run: node coordinator/test_biquote_v3_chronological_replay.js
      - name: Real local review HTTP route serves new mobile UI, no credential, broker or paid feed
        run: |
          node coordinator/test_internal_offline_handoff.js
          node coordinator/test_prelicense_release_audit.js
          node --test coordinator/tests/review_dashboard_safety.test.js
          node coordinator/test_review_dashboard_route.js
          node coordinator/test_review_dashboard_private_biquote.js
          node --check review-dashboard.js
      - name: Private mobile dashboard shows contiguous, not raw H4 trade history
        run: node coordinator/test_private_monitor_signal_readiness.js
      - name: Provider-neutral XAUUSD parity through V3 r2 and paper block (offline only)
        working-directory: coordinator
        run: python -m unittest -v test_xauusd_feed_gate test_xauusd_research_pipeline
      - name: Pre-license restart and failover operational commissioning (synthetic only)
        working-directory: coordinator
        run: python -m unittest -v test_prelicense_operational_commissioning
      - name: Paper account cannot act on synthetic BUY or forged approval
        run: python -m unittest -v coordinator/test_ultimate_four_stage_paper.py
      - name: Underlying vault and final source quality safety tests
        working-directory: coordinator
        run: python -m unittest -v test_biquote_forward_shadow_review test_biquote_24h_final_verdict test_biquote_private_forward_vault test_biquote_v3_chronological_private
