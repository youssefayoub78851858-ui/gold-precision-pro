name: BiQuote private forward vault offline tests (no feed calls)
on:
  push:
    branches: [review/v2-portable-tests-20261109]
    paths:
      - 'coordinator/biquote_private_forward_vault.py'
      - 'coordinator/test_biquote_private_forward_vault.py'
      - '.github/workflows/biquote-private-forward-vault-offline.yml'
      - 'coordinator/biquote_offline_source_audit.py'
      - 'coordinator/biquote_overlap_evidence.py'
      - 'coordinator/biquote_public_one_shot.py'
      - 'coordinator/biquote_24h_observer.py'
      - 'coordinator/test_biquote_24h_observer.py'
      - 'coordinator/test_biquote_forward_integration.py'
      - 'coordinator/entrypoint.py'
      - 'coordinator/biquote_seven_day_review.py'
      - 'coordinator/test_biquote_seven_day_review.py'
      - 'coordinator/Dockerfile'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forward-vault-mock-only:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify no network, private disk, closed-only time seal and archive integrity
        working-directory: coordinator
        run: python -m unittest -v test_biquote_private_forward_vault test_biquote_forward_integration test_biquote_24h_observer test_biquote_public_one_shot test_biquote_render_standby test_biquote_seven_day_review
      - name: Source audit and overlap compatibility unchanged (synthetic only)
        working-directory: coordinator
        run: python -m unittest -v test_biquote_offline_source_audit test_biquote_overlap_evidence
