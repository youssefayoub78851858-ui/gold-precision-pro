name: BiQuote private forward vault offline tests (no feed calls)
on:
  push:
    branches: [review/v2-portable-tests-20261109]
    paths:
      - 'coordinator/biquote_private_forward_vault.py'
      - 'coordinator/biquote_collector_log_cadence_gate.js'
      - 'coordinator/test_biquote_collector_log_cadence_gate.js'
      - 'coordinator/biquote_render_log_export_readonly.js'
      - 'coordinator/test_biquote_render_log_export_readonly.js'
      - 'coordinator/biquote_capture_h4_horizon_gate.js'
      - 'coordinator/test_biquote_capture_h4_horizon_gate.js'
      - 'coordinator/biquote_h4_evidence_quality_gate.js'
      - 'coordinator/test_biquote_h4_evidence_quality_gate.js'
      - 'coordinator/biquote_stage3_log_reconciliation.js'
      - 'coordinator/test_biquote_stage3_log_reconciliation.js'
      - 'coordinator/test_biquote_private_forward_vault.py'
      - 'coordinator/test_biquote_first_seen_collector_cutover.py'
      - 'coordinator/biquote_owner_private_copy_once.py'
      - 'coordinator/test_biquote_owner_private_copy_once.py'
      - 'coordinator/biquote_owner_vault_inventory.py'
      - 'coordinator/test_biquote_owner_vault_inventory.py'
      - 'coordinator/biquote_private_archive_predeploy_guard.py'
      - 'coordinator/test_biquote_private_archive_predeploy_guard.py'
      - 'coordinator/biquote_collector_backup_preflight.py'
      - 'coordinator/test_biquote_collector_backup_preflight.py'
      - 'coordinator/biquote_collector_restore_rehearsal.py'
      - 'coordinator/test_biquote_collector_restore_rehearsal.py'
      - 'coordinator/biquote_render_snapshot_preflight.py'
      - 'coordinator/test_biquote_render_snapshot_preflight.py'
      - 'coordinator/BIQUOTE-FIRST-SEEN-CUTOVER.md'
      - '.github/workflows/biquote-private-forward-vault-offline.yml'
      - 'coordinator/biquote_offline_source_audit.py'
      - 'coordinator/biquote_overlap_evidence.py'
      - 'coordinator/biquote_public_one_shot.py'
      - 'coordinator/biquote_24h_observer.py'
      - 'coordinator/test_biquote_24h_observer.py'
      - 'coordinator/test_biquote_forward_integration.py'
      - 'coordinator/entrypoint.py'
      - 'coordinator/biquote_seven_day_review.py'
      - 'coordinator/biquote_session_gap_audit.py'
      - 'coordinator/biquote_sampled_spread_buckets.py'
      - 'coordinator/test_biquote_sampled_spread_buckets.py'
      - 'coordinator/biquote_quote_cadence.py'
      - 'coordinator/test_biquote_quote_cadence.py'
      - 'coordinator/test_biquote_session_gap_audit.py'
      - 'coordinator/test_biquote_seven_day_review.py'
      - 'coordinator/Dockerfile'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forward-vault-mock-only:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Sanitized Render collector log continuity only, WAIT, no provider or vault access
        run: node coordinator/test_biquote_collector_log_cadence_gate.js
      - name: Reconcile sanitized Stage3 frame, OHLC and quote-cadence counters (offline)
        run: node coordinator/test_biquote_stage3_log_reconciliation.js
      - name: Render log-export adapter never exposes private candle values or market authority
        run: node coordinator/test_biquote_render_log_export_readonly.js
      - name: 'H4 capture horizon feasibility: offline 50-bar ceiling, no orders'
        run: node coordinator/test_biquote_capture_h4_horizon_gate.js
      - name: 'H4 audit quality: distinguish stored, contiguous and M15-comparable bars'
        run: node coordinator/test_biquote_h4_evidence_quality_gate.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify no network, private disk, closed-only time seal and archive integrity
        working-directory: coordinator
        run: python -m unittest -v test_biquote_private_forward_vault test_biquote_first_seen_collector_cutover test_biquote_collector_backup_preflight test_biquote_collector_restore_rehearsal test_biquote_render_snapshot_preflight test_biquote_forward_integration test_biquote_24h_observer test_biquote_public_one_shot test_biquote_render_standby test_biquote_seven_day_review test_biquote_session_gap_audit test_biquote_sampled_spread_buckets test_biquote_quote_cadence
      - name: Owner-only sealed backup, no overwrite, isolated recovery and read-only inventory (synthetic)
        working-directory: coordinator
        run: python -m unittest -v test_biquote_owner_private_copy_once test_biquote_owner_vault_inventory test_biquote_private_archive_predeploy_guard
      - name: Source audit and overlap compatibility unchanged (synthetic only)
        working-directory: coordinator
        run: python -m unittest -v test_biquote_offline_source_audit test_biquote_overlap_evidence
