name: V2 historical XAUUSD research (Dukascopy, no provider key)
# Audit raw BUY/SELL signal balance independently of closed trades.
on:
  workflow_dispatch:
  push:
    branches:
      - review/v2-portable-tests-20261109
    paths:
      - '.github/workflows/v2-real-history.yml'
jobs:
  historical-research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download public Dukascopy BID candles for September 2026
        run: |
          mkdir -p research/raw
          for frame in m15 h1 h4; do
            npx --yes dukascopy-node -i xauusd -from 2026-09-01 -to 2026-10-01 -t "$frame" -f csv -dir "research/raw/$frame"
          done
      - name: Convert and validate market candles
        run: python coordinator/import_dukascopy_csv.py research/raw research/history.json
      - name: Backtest frozen V2 engine without placing orders
        run: |
          node coordinator/run_historical_backtest.js research/history.json --details > research/report-with-trades.txt
          node coordinator/analyze_historical_losses.js research/history.json > research/loss-analysis.json
          node coordinator/diagnose_signal_bias.js research/history.json > research/bias-diagnostics.json
      - name: Print performance summary
        run: cat research/bias-diagnostics.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xauusd-historical-research-sep-2026
          path: |
            research/report-with-trades.txt
            research/loss-analysis.json
            research/bias-diagnostics.json
            research/history.json
          retention-days: 7
