name: V2 October 2026 out-of-sample validation
# Audit raw BUY/SELL signal balance independently of closed trades.
on:
  workflow_dispatch:
  push:
    branches:
      - review/v2-portable-tests-20261109
    paths:
      - '.github/workflows/v2-october-validation.yml'
jobs:
  historical-research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download public Dukascopy BID candles for October 2026
        run: |
          mkdir -p research/raw
          for frame in m15 h1 h4; do
            npx --yes dukascopy-node -i xauusd -from 2026-10-01 -to 2026-11-01 -t "$frame" -f csv -dir "research/raw/$frame"
          done
      - name: Convert and validate market candles
        run: python coordinator/import_dukascopy_csv.py research/raw research/history.json
      - name: Rebuild consistent H1 H4 from complete M15 bars
        run: python coordinator/rebuild_consistent_frames.py research/history.json research/consistent-history.json
      - name: Backtest frozen V2 engine without placing orders
        run: |
          node coordinator/run_historical_backtest.js research/history.json > research/original-report.json
          node coordinator/run_historical_backtest.js research/consistent-history.json > research/consistent-report.json
          node coordinator/analyze_historical_losses.js research/consistent-history.json > research/loss-analysis.json
          node coordinator/diagnose_signal_bias.js research/consistent-history.json > research/bias-diagnostics.json
          node coordinator/compare_entry_filters.js research/consistent-history.json > research/filter-comparison.json
      - name: Print performance summary
        run: |
          cat research/original-report.json
          cat research/consistent-report.json
          cat research/filter-comparison.json
          python - <<'PY'
          import json
          d=json.load(open('research/filter-comparison.json'))
          base=next(x for x in d['results'] if x['name']=='baseline')
          fixed=next(x for x in d['results'] if x['name']=='cooldown_8_bars')
          print('OUT-OF-SAMPLE fixed 8-bar cooldown versus baseline:')
          print(json.dumps({'baseline':base,'fixed8':fixed,'improvementR':round(fixed['totalR']-base['totalR'],2)},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xauusd-out-of-sample-oct-2026
          path: |
            research/original-report.json
            research/consistent-report.json
            research/consistent-history.json
            research/loss-analysis.json
            research/bias-diagnostics.json
            research/filter-comparison.json
            research/history.json
          retention-days: 7
