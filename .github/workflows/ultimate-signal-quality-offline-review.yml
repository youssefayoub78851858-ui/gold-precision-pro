name: Ultimate signal-quality offline diagnostics
on:
  push:
    branches: [review/v2-portable-tests-20261109]
    paths:
      - coordinator/xauusd_spread_noise_guard.js
      - coordinator/test_xauusd_spread_noise_guard.js
      - coordinator/ultimate_research_extensions.js
      - coordinator/test_ultimate_research_extensions.js
      - coordinator/xauusd_spread_proof_readiness.js
      - coordinator/test_xauusd_spread_proof_readiness.js
      - research/recorded/manifest.json
      - research/recorded/2026-09-bid.json
      - research/recorded/2026-10-bid.json
      - coordinator/ultimate_entry_recorded_coverage.js
      - coordinator/test_ultimate_entry_recorded_coverage.js
      - coordinator/ultimate_entry_robustness.js
      - coordinator/test_ultimate_entry_robustness.js
      - coordinator/ultimate_signal_quality.js
      - coordinator/ultimate_signal_quality_report.js
      - coordinator/ultimate_shadow_admission.js
      - coordinator/test_ultimate_shadow_admission.js
      - coordinator/ultimate_filter_pairwise_audit.js
      - coordinator/test_ultimate_filter_pairwise_audit.js
      - coordinator/test_ultimate_signal_quality.js
      - coordinator/ultimate_four_stage_review.js
      - coordinator/test_ultimate_four_stage_review.js
      - coordinator/test_ultimate_four_stage_paper.py
      - coordinator/v3_ultimate.js
      - .github/workflows/ultimate-signal-quality-offline-review.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signal-quality-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Offline no-lookahead signal quality and risk gate diagnostics
        run: node coordinator/test_ultimate_signal_quality.js
      - name: Independent research-only entry quality, adverse wick and 2x cost stress
        run: node coordinator/test_ultimate_entry_robustness.js
      - name: Hash-locked September October BID-only entry-feature coverage, no win-rate claims
        run: node coordinator/test_ultimate_entry_recorded_coverage.js
      - name: Integrated four stages - research candidates, context, data and paper readiness
        run: node coordinator/test_ultimate_four_stage_review.js
      - name: Offline paper admission stays locked for synthetic preview
        run: python3 -m unittest -v coordinator/test_ultimate_four_stage_paper.py
      - name: Conservative V3 shadow signal veto including Binance isolation
        run: node coordinator/test_ultimate_shadow_admission.js
      - name: Fixed paired baseline vs shadow-filter candidate audit safety (offline)
        run: node coordinator/test_ultimate_filter_pairwise_audit.js
      - name: Chronological fixed paired holdout stability and small-sample warnings
        run: node coordinator/test_ultimate_pairwise_stability.js
      - name: Fast closed XAUUSD BID ASK MID spread and fake-breakout safety regression
        run: node coordinator/test_xauusd_spread_noise_guard.js
      - name: Verify actual archived gold dataset is BID-only and cannot prove spread improvement
        run: node coordinator/test_xauusd_spread_proof_readiness.js
      - name: Existing V3 Ultimate contract safety regression
        run: node coordinator/test_v3_ultimate.js
