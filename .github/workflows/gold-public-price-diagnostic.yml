name: One-time Gold API public price format diagnostic
on:
  push:
    branches: [review/v2-portable-tests-20261109]
    paths: [.github/workflows/gold-public-price-diagnostic.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect public spot gold API shape without storing data
        run: |
          node <<'JS'
          const url='https://api.gold-api.com/price/XAU';
          try{
            const response=await fetch(url,{signal:AbortSignal.timeout(10000),headers:{Accept:'application/json'}});
            const text=await response.text();
            const data=JSON.parse(text);
            const summary={http:response.status,contentType:response.headers.get('content-type'),
              keys:Object.keys(data),symbol:data.symbol,currency:data.currency,price:data.price,
              updatedAt:data.updatedAt, cacheControl:response.headers.get('cache-control'),
              responseDate:response.headers.get('date')};
            console.log(JSON.stringify(summary));
          }catch(e){console.log(JSON.stringify({error:e.name,message:String(e.message).slice(0,100)}));process.exitCode=1;}
          JS
