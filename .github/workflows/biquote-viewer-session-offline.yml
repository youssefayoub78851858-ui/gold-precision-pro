name: BiQuote private viewer and decision board safety (offline)
on:
  push:
    branches: [review/v2-portable-tests-20261109]
    paths:
      - 'coordinator/biquote_viewer_session.js'
      - 'coordinator/test_biquote_viewer_session.js'
      - 'coordinator/biquote_mobile_readonly.js'
      - 'server.js'
      - 'ultimate.html'
      - 'biquote-mobile-ui.js'
      - 'biquote-live-candle-preview.js'
      - 'test_biquote_live_candle_preview.js'
      - 'test_biquote_live_chart_ui.js'
      - 'test_unified_mobile.js'
      - 'test_gold_decision_readiness.js'
      - '.github/workflows/biquote-viewer-session-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secure-viewer-and-decision-board:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Server-signed cookie, expiry, same-origin, session revocation
        run: node coordinator/test_biquote_viewer_session.js
      - name: Fresh private BiQuote sampled forming candles, never real trading
        run: node test_biquote_live_candle_preview.js
      - name: Browser simulation - token once, no storage, old data cleared
        run: node test_biquote_live_chart_ui.js
      - name: Unified mobile DOM with paper trading isolation
        run: node test_unified_mobile.js
      - name: Decision source readiness is static and archive remains private
        run: node test_gold_decision_readiness.js
      - name: Protected proxy never relays private prices or forged status
        run: node coordinator/test_review_monitor_proxy.js
      - name: Keep raw gold feed and paper orders isolated
        run: node coordinator/test_biquote_mobile_readonly.js
