name: Review dashboard safety
on:
  push:
    branches:
      - review/v2-portable-tests-20261109
    paths:
      - 'review-dashboard.js'
      - 'coordinator/biquote_private_v3_watch.js'
      - 'coordinator/biquote_mtf_readiness.js'
      - 'coordinator/v3_multitimeframe.js'
      - 'coordinator/tests/review_dashboard_safety.test.js'
      - 'coordinator/test_ultimate_v2_public_shadow.js'
      - 'coordinator/ultimate_v2_public_shadow.js'
      - 'coordinator/ultimate_v2.js'
      - 'coordinator/ultimate_v2_contracts.js'
      - 'coordinator/test_ultimate_v2.js'
      - 'coordinator/v3_ultimate.js'
      - 'coordinator/fixtures/ultimate-synthetic.json'
      - '.github/workflows/review-dashboard-safety.yml'
  workflow_dispatch:
jobs:
  offline-safety:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check review-dashboard.js
          node --check coordinator/tests/review_dashboard_safety.test.js
          node --check coordinator/biquote_private_v3_watch.js
          node --check coordinator/biquote_mtf_readiness.js
          node --check coordinator/v3_multitimeframe.js
          node --check coordinator/test_ultimate_v2_public_shadow.js
          node --check coordinator/ultimate_v2_public_shadow.js
          node --check coordinator/ultimate_v2.js
          node --check coordinator/ultimate_v2_contracts.js
          node --check coordinator/test_ultimate_v2.js
      - name: Run offline safety regression tests
        run: node --test coordinator/tests/review_dashboard_safety.test.js
      - name: Verify frozen Ultimate v2 offline contracts
        run: node coordinator/test_ultimate_v2.js
      - name: Verify seven-layer public shadow quarantine (offline)
        run: node coordinator/test_ultimate_v2_public_shadow.js
